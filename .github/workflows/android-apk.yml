name: Build CCTV Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CCTV_Android5_inline_video_fix.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f CCTV_Android5_inline_video_fix.zip || { echo 'File CCTV_Android5_inline_video_fix.zip tidak ditemukan di root repository.'; exit 1; }
          mkdir -p extracted
          unzip -oq CCTV_Android5_inline_video_fix.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo 'settings.gradle tidak ditemukan di dalam ZIP.'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Secret ANDROID_KEYSTORE_BASE64 belum diatur.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/cctv-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cctv-signing/release.jks"
          test -s "$RUNNER_TEMP/cctv-signing/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/cctv-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_STORE_PASSWORD" || { echo 'Secret ANDROID_KEYSTORE_PASSWORD belum diatur.'; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo 'Secret ANDROID_KEY_ALIAS belum diatur.'; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo 'Secret ANDROID_KEY_PASSWORD belum diatur.'; exit 1; }
          gradle --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Monitoring-Android5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
